plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def getApiKey() {
    def keysProperties = new Properties()
    keysProperties.load(project.rootProject.file("local.properties").newDataInputStream())
    def ApiKey = keysProperties.getProperty("news_api_key", "")
    return ApiKey
}

android {
    namespace 'com.segunfrancis.newsfeed'
    compileSdk 37

    defaultConfig {
        applicationId "com.segunfrancis.newsfeed"
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"
                ]
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField("String", "NEWS_API_KEY", getApiKey())
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField("String", "NEWS_API_KEY", getApiKey())
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // --- Jetpack Compose Bill of Materials (BOM) ---
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    testImplementation platform('androidx.compose:compose-bom:2026.06.00')
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.00')

    // Material 3 & Compose Components (Versions managed by BOM)
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-adaptive-navigation-suite"
    implementation "androidx.compose.material3.adaptive:adaptive"
    implementation "androidx.compose.material3.adaptive:adaptive-layout"
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    // Navigation, Thread Safety & State Observables
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.navigation:navigation-compose:2.9.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.2"

    // API Networking Setup
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"

    // Media Pipeline & Diagnostics
    implementation "io.coil-kt:coil-compose:2.6.0"
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // Dagger Hilt Dependancy Engine
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'
    implementation "com.google.dagger:hilt-android:2.57.1"
    kapt "com.google.dagger:hilt-compiler:2.57.1"

    // Room Storage Layers
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-paging:$room_version"

    // Pagination & Supporting Jetpack Frameworks
    implementation "androidx.paging:paging-runtime-ktx:3.5.0"
    implementation "androidx.paging:paging-compose:3.5.0"
    implementation "com.airbnb.android:lottie-compose:6.4.1"
    implementation "androidx.datastore:datastore-preferences:1.2.1"
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.constraintlayout:constraintlayout-compose:1.1.0"

    // Mock Testing Frameworks
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation "androidx.room:room-testing:$room_version"
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

kapt {
    correctErrorTypes true
}

configurations.configureEach {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'androidx.lifecycle') {
            details.useVersion '2.8.2'
        }
    }
}
