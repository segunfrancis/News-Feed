[bundles]
compose = [
    "androidxComposeUi",
    "androidxComposeUiToolingPreview",
    "androidxComposeMaterialIconsExtended",
    "androidxComposeMaterial3",
    "androidxComposeMaterial3AdaptiveNavigationSuite",
    "androidxComposeMaterial3Adaptive",
    "androidxComposeMaterial3AdaptiveLayout"
]
